name: Compile RP2040 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi g++-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Download Pico SDK
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Compile Firmware
      run: |
        mkdir build
        cd build
        cmake ..
        make smart_lcc
        make smart_lcc_combined

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenLCC-Firmware
        path: build/smart_lcc_combined.uf2
